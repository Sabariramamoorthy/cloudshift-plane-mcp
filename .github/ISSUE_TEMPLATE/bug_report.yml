name: Bug report
description: Something doesn't work as documented
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, workspace names, and hostnames from everything you paste.
        Security issues: please use a private advisory instead (see SECURITY.md).
  - type: input
    id: plane
    attributes:
      label: Plane edition and version
      description: Cloud, Commercial, or Community Edition with version (see /api/instances/ on your instance)
      placeholder: Community Edition 1.3.1
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, "http (API key)", "http (OAuth)", sse]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Cursor 2.x, Claude Desktop, VS Code, ...
  - type: input
    id: version
    attributes:
      label: cloudshift-plane-mcp version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Tool called, arguments, and the error or wrong output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server log lines around the failure (redacted)
      render: text
