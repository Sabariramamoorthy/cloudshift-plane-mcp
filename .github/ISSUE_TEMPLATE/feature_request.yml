name: Feature request
description: Suggest a new tool, report, or improvement
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: input
    id: plane
    attributes:
      label: Plane edition and version you need this on
      placeholder: Community Edition 1.3.1
